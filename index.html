<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wing Font</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script>
    // Commands must be associated as soon as the page loads, the way
    // Microsoft's samples do it; app.js is a module that finishes loading
    // (WASM, Office.onReady) later. So register a forwarder now and let
    // app.js supply the real handler.
    var wingFontCommand = new Promise(function (resolve) { window.wingFontCommandReady = resolve; });
    if (window.Office && Office.actions && Office.actions.associate) {
      Office.actions.associate("convertSelection", function (event) {
        return wingFontCommand.then(function (run) { return run(event); });
      });
    }
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff; --fg: #242424; --muted: #616161; --line: #e0e0e0; --card: #f5f5f5;
      --accent: #c43e1c; --accent-fg: #fff; --warn-bg: #fdf3f4; --warn-fg: #b10e1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1f1f; --fg: #f0f0f0; --muted: #adadad; --line: #424242; --card: #2b2b2b;
        --accent: #e8825d; --accent-fg: #1f1f1f; --warn-bg: #3b1519; --warn-fg: #f1a7ad;
      }
    }
    * { box-sizing: border-box; }
    body { font: 13px/1.5 "Segoe UI", system-ui, -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
           margin: 0; padding: 12px; background: var(--bg); color: var(--fg); }
    h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 6px; letter-spacing: .02em; }
    button, .button { font: inherit; padding: 7px 12px; border-radius: 4px; border: 1px solid var(--line);
                      background: var(--bg); color: var(--fg); cursor: pointer; }
    button:hover, .button:hover { background: var(--card); }
    button:focus-visible, .button:focus-within, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .actions { display: flex; gap: 8px; }
    #convert { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
    #convert:hover { filter: brightness(1.08); }

    /* Font card */
    .card { background: var(--card); border-radius: 6px; padding: 8px 10px; }
    #fontinfo { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
    #fontinfo:empty::before { content: attr(data-empty); color: var(--muted); }
    #fontinfo.bad { color: var(--warn-fg); }
    .card:has(#fontinfo.bad) { background: var(--warn-bg); }
    details { margin-top: 6px; font-size: 12px; }
    summary { cursor: pointer; color: var(--muted); }
    details label { display: block; margin-top: 8px; color: var(--muted); }
    input[type=text] { width: 100%; margin-top: 2px; padding: 5px 6px; font: inherit; color: var(--fg);
                       background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
    .button { display: inline-block; margin-top: 8px; font-size: 12px; }
    button.quiet { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .button input { position: absolute; opacity: 0; width: 1px; height: 1px; }

    /* Reading picker */
    #variants .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
    #variants .row + .row { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    #variants:empty::before { content: attr(data-empty); color: var(--muted); font-size: 12px; }
    #variants button { font-size: 34px; line-height: 1.7; padding: 2px 0 0; }
    #variants button[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

    #status { margin: 12px 0 0; white-space: pre-wrap; font-size: 12px; color: var(--muted); }
    #status.bad { color: var(--warn-fg); }
    #mixed { margin: 10px 0 0; padding: 6px 10px; border-radius: 6px; font-size: 12px; background: var(--warn-bg); color: var(--warn-fg); }
    /* Standalone sandbox: ccmp off imitates PowerPoint's lack of GSUB. */
    #sandbox { width: 100%; height: 7em; margin-top: 12px; padding: 6px; font-size: 28px; line-height: 1.9; color: var(--fg);
               background: var(--bg); border: 1px dashed var(--line); border-radius: 4px; font-feature-settings: "ccmp" 0; }
  </style>
</head>
<body>
  <div class="actions">
    <button id="convert" data-i18n="convert"></button>
    <button id="restore" data-i18n="restore" data-i18n-attr="title:restoreTip"></button>
  </div>
  <p id="mixed" role="status" data-i18n="mixedFonts" hidden></p>
  <p id="status" role="status">…</p>

  <h2 data-i18n="pickHeading"></h2>
  <div id="variants" data-i18n-attr="data-empty:pickEmpty"></div>

  <h2 data-i18n="fontHeading"></h2>
  <div class="card">
    <p id="fontinfo" role="status" data-i18n-attr="data-empty:fontEmpty"></p>
    <details id="fontopts">
      <summary data-i18n="changeFont"></summary>
      <label><span data-i18n="fontField"></span>
        <input type="text" id="font" data-i18n-attr="placeholder:fontPlaceholder">
      </label>
      <label class="button"><span data-i18n="pickFile"></span>
        <input type="file" id="file" accept=".ttf,.otf,.woff2">
      </label>
      <button id="forget" class="quiet" data-i18n="forget" data-i18n-attr="title:forgetTip"></button>
    </details>
  </div>

  <textarea id="sandbox" hidden data-i18n-attr="aria-label:sandboxLabel">我去銀行攞錢，行２路返屋企。行０ｚａａ１</textarea>
  <script type="module" src="app.js"></script>
</body>
</html>
